name: 오늘의 산업 기사 수집
on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST (UTC 21:00)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 기사 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python3 tools/fetch_news.py
      - name: 변경 저장
        run: |
          git config user.name "helpertom-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news/latest.json
          git diff --cached --quiet && echo "변경 없음" || (git commit -m "기사 갱신 $(TZ=Asia/Seoul date +%F)" && git push)
