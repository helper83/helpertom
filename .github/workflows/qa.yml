name: 배포 전 QA
on:
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'data/**', 'tools/qa/**', '.github/workflows/qa.yml']
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright 설치(브라우저는 러너의 Chrome 사용)
        run: pip install playwright
      - name: QA 실행(전 탭·산업·직무·링크·도움말·3개 폭)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: python3 -I tools/qa/run_all.py
